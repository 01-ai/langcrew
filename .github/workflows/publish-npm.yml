name: Publish langcrew-agentx

on:
  push:
    tags:
      - 'langcrew-agentx==*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node 24 ships npm 11.5+, required for Trusted Publisher OIDC.
      # Do not set registry-url: setup-node would write an empty _authToken
      # and npm would skip OIDC, failing the publish with E404.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Check tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#langcrew-agentx==}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag version ${TAG} does not match package.json version ${PKG}"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --run
      - run: pnpm publish --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ''
