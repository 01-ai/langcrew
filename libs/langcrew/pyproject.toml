[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "tests/",
    "uv.lock",
]

[tool.hatch.build.targets.wheel]
packages = ["langcrew"]

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "langcrew"
version = "0.6.18"
description = "A LangChain-based crew management system"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "BTM Team", email = "btm@langcrew.ai"},
]
keywords = ["langchain", "agents", "multi-agent", "orchestration", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Core data validation
    "pydantic>=2.0.0",
    # LangChain framework and integrations
    "langchain>=1.0.2,<3.0.0",
    "langchain-core>=1.3.3,<3.0.0",
    "langgraph>=1.0.0,<3.0.0",
    "langchain-anthropic>=1.0.0,<3.0.0",
    "langchain-deepseek>=1.0.0,<3.0.0",
    "langchain-openai>=1.0.0,<3.0.0",
    "google-genai>=1.39.0",
    # Memory management
    "langmem",
    # Multi-agent communication protocol
    "mcp>=0.1.0",
    "langchain-mcp-adapters>=0.1.11",
    # Web API and HTTP utilities
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
    "aiofiles>=23.0.0",
    # AWS / Bedrock
    "langchain-aws >=1.0.0",
    "boto3>=1.39.6,<2.0.0",
    "langchain-google-genai>=4.1.2",
    # CEL expression evaluation for workflows
    "cel-python>=0.3.0",
    "litellm>=1.72.6",
]

[project.urls]
Homepage = "https://langcrew.ai/"
Repository = "https://github.com/01-ai/langcrew"
Documentation = "https://langcrew.ai/guides/quickstart/"
Issues = "https://github.com/01-ai/langcrew/issues"

[project.optional-dependencies]
redis = ["langgraph-checkpoint-redis>=0.0.8"]
mongodb = [
    "langgraph-checkpoint-mongodb>=0.1.4",
    "langgraph-store-mongodb>=0.0.1",
]
mysql = ["langgraph-checkpoint-mysql[pymysql, aiomysql]>=2.0.17"]
postgres = [
    "langgraph-checkpoint-postgres>=2.0.23",
    "psycopg[binary,pool]>=3.0.0",
]
sqlite = ["langgraph-checkpoint-sqlite>=2.0.10"]
chatkit = [
    "openai-chatkit>=0.1.0",
    "jinja2>=3.1.0",
    "jsonschema>=4.0.0",
]
all-backends = [
    "langgraph-checkpoint-sqlite>=2.0.10",
    "langgraph-checkpoint-redis>=0.0.8",
    "langgraph-checkpoint-mongodb>=0.1.4",
    "langgraph-checkpoint-mysql[pymysql, aiomysql, asyncmy]>=2.0.17",
    "langgraph-checkpoint-postgres>=2.0.23",
    "langgraph-store-mongodb>=0.0.1",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-dotenv>=0.5.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "types-requests>=2.31.0",
]

[tool.uv]
prerelease = "allow"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--full-trace --strict-markers --strict-config --durations=5"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "asyncio: marks tests as asyncio tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
lint.select = ["E", "F", "I", "TID251", "UP"]
lint.ignore = ["E501"]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["UP006", "UP007"]

[tool.ruff.format]
preview = true

[tool.ty]

[tool.ty.rules]
unresolved-import = "warn"

[tool.ty.environment]
python-version = "3.10"

[tool.coverage.run]
source = ["langcrew"]
omit = ["tests/*", "langcrew/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
